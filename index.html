<!DOCTYPE html>
<html lang="fr" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Airplane</title>
<meta name="description" content="Projets et expérimentations de Data Airplane.">
<style>
  :root {
    --bg: #eef1f8;
    --card-bg: rgba(255, 255, 255, 0.62);
    --card-border: rgba(255, 255, 255, 0.8);
    --text: #1c1e2b;
    --text-muted: #545a70;
    --text-faint: #5f6684;
    --accent: #4a69f5;
    --accent-2: #8452f5;
    --accent-contrast: #ffffff;
    --accent-soft: #e3e8fd;
    --shadow: 0 20px 60px -20px rgba(28, 30, 60, 0.25);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0e16;
      --card-bg: rgba(255, 255, 255, 0.055);
      --card-border: rgba(255, 255, 255, 0.12);
      --text: #eef0f6;
      --text-muted: #a7acc4;
      --text-faint: #8890ac;
      --accent: #7c93ff;
      --accent-2: #b399ff;
      --accent-contrast: #0c0d10;
      --accent-soft: rgba(124, 147, 255, 0.16);
      --shadow: 0 20px 60px -20px rgba(0, 0, 0, 0.6);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }

  .page {
    width: 100%;
    max-width: 620px;
  }

  .card {
    background: var(--card-bg);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border: 1px solid var(--card-border);
    border-radius: 22px;
    box-shadow: var(--shadow);
    padding: 2.5rem;
  }

  .marque {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin: 0 0 1.25rem;
  }

  .pastille {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
  }

  h1 {
    font-size: 2.2rem;
    font-weight: 800;
    letter-spacing: -0.025em;
    margin: 0 0 0.6rem;
  }

  .intro {
    color: var(--text-muted);
    font-size: 1.05rem;
    line-height: 1.6;
    margin: 0 0 2rem;
  }

  .projets {
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
  }

  .projet {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 1.1rem 1.3rem;
    border-radius: 14px;
    background: var(--accent-soft);
    text-decoration: none;
    color: inherit;
    transition: transform 0.15s ease;
  }

  .projet:hover { transform: translateY(-1px); }

  .projet-nom { font-weight: 700; }
  .projet-desc { color: var(--text-muted); font-size: 0.9rem; margin-top: 0.15rem; }

  .fleche {
    color: var(--accent);
    font-weight: 700;
    flex-shrink: 0;
  }

  footer {
    margin-top: 2rem;
    text-align: center;
    color: var(--text-faint);
    font-size: 0.85rem;
  }
</style>
</head>
<body>
  <div class="page">
    <div class="card">
      <p class="marque"><span class="pastille"></span>Data Airplane</p>
      <h1>Salut, je suis DataAIrplane.</h1>
      <p class="intro">
        Ici, quelques projets perso — pour l'instant surtout des expérimentations
        de données. Le blog en lui-même arrive bientôt.
      </p>

      <div class="projets">
        <a class="projet" href="https://fdj-predictions.vercel.app" target="_blank" rel="noopener noreferrer">
          <span>
            <span class="projet-nom">FDJ Predictions</span>
            <div class="projet-desc">Statistiques et grilles suggérées pour l'Euromillions</div>
          </span>
          <span class="fleche">→</span>
        </a>
      </div>
    </div>
    <footer>
      &copy; 2026 Data Airplane
    </footer>
  </div>
</body>
</html>
