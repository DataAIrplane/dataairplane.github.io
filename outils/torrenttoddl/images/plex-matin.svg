<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-label="Illustration de la page d'accueil de Plex : films ajoutés récemment et nouveaux épisodes de séries, avec ce qui n'a pas encore été vu et ce qui est en cours">
  <defs>
    <radialGradient id="fond" cx="18%" cy="0%" r="115%">
      <stop offset="0" stop-color="#1e2d52"/>
      <stop offset=".55" stop-color="#0f172e"/>
      <stop offset="1" stop-color="#080d1a"/>
    </radialGradient>
    <pattern id="points" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#94a3b8" opacity=".10"/>
    </pattern>
    <linearGradient id="carte" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2c4a"/>
      <stop offset="1" stop-color="#151e35"/>
    </linearGradient>
    <filter id="ombre" x="-10%" y="-25%" width="120%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000000" flood-opacity=".55"/>
    </filter>
    <filter id="lueur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="flou"/>
      <feMerge><feMergeNode in="flou"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <marker id="fl-bleu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/></marker>
    <marker id="fl-vert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
    <marker id="fl-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fb923c"/></marker>
    <marker id="fl-jaune" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#facc15"/></marker>
    <marker id="fl-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c084fc"/></marker>
    <marker id="fl-rouge" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker>
    <marker id="fl-gris" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>

    <!-- Pictogrammes dessinés pour l'article (pas de logo officiel utilisé) -->
    <linearGradient id="g-orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdba74"/><stop offset="1" stop-color="#ea580c"/></linearGradient>
    <linearGradient id="g-vert" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6ee7b7"/><stop offset="1" stop-color="#059669"/></linearGradient>
    <linearGradient id="g-bleu" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#93c5fd"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="g-jaune" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#d97706"/></linearGradient>
    <linearGradient id="g-gris" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cbd5e1"/><stop offset="1" stop-color="#475569"/></linearGradient>

    <symbol id="i-alldebrid" viewBox="0 0 44 44">
      <rect width="44" height="44" rx="11" fill="url(#g-orange)"/>
      <path d="M14.5 29.5a6 6 0 0 1 .4-11.9A8.2 8.2 0 0 1 30.6 16a6.6 6.6 0 0 1 .4 13.4" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M22 20.5v13m-4.6-4.6L22 33.5l4.6-4.6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-torrenttoddl" viewBox="0 0 44 44">
      <rect width="44" height="44" rx="11" fill="url(#g-vert)"/>
      <path d="M15 11v8a7 7 0 0 0 14 0v-8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <path d="M12.5 11h5M26.5 11h5" stroke="#064e3b" stroke-width="3" stroke-linecap="round"/>
      <path d="M22 26v9m-4-4 4 4 4-4" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-rss" viewBox="0 0 44 44">
      <rect width="44" height="44" rx="11" fill="url(#g-orange)"/>
      <circle cx="15" cy="29" r="2.8" fill="#fff"/>
      <path d="M12.5 20.5a11 11 0 0 1 11 11M12.5 12.5a19 19 0 0 1 19 19" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-recherche" viewBox="0 0 44 44">
      <rect width="44" height="44" rx="11" fill="url(#g-bleu)"/>
      <circle cx="20" cy="20" r="7.5" fill="none" stroke="#fff" stroke-width="3"/>
      <path d="M25.5 25.5 32 32" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-dossier" viewBox="0 0 44 44">
      <rect width="44" height="44" rx="11" fill="url(#g-jaune)"/>
      <path d="M11 15.5a2 2 0 0 1 2-2h6.5l3 3H31a2 2 0 0 1 2 2V29a2 2 0 0 1-2 2H13a2 2 0 0 1-2-2z" fill="#fff"/>
    </symbol>
    <symbol id="i-box" viewBox="0 0 44 44">
      <rect width="44" height="44" rx="11" fill="url(#g-gris)"/>
      <rect x="10" y="23" width="24" height="9" rx="2.5" fill="#fff"/>
      <circle cx="15" cy="27.5" r="1.4" fill="#475569"/><circle cx="19.5" cy="27.5" r="1.4" fill="#475569"/>
      <path d="M16 23l-3-9M28 23l3-9" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
    </symbol>

    <style>
      text { font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", sans-serif; fill: #e2e8f0; }
      .titre { font-size: 27px; font-weight: 800; fill: #ffffff; letter-spacing: -.01em; }
      .soustitre { font-size: 15px; fill: #94a3b8; }
      .zone { fill: #ffffff; fill-opacity: .025; stroke: #94a3b8; stroke-opacity: .22; stroke-width: 1.2; }
      .zone.pointilles { stroke-dasharray: 6 6; }
      .zone.vm { stroke: #22d3ee; stroke-opacity: .55; }
      .zone.docker { stroke: #38bdf8; stroke-opacity: .45; stroke-dasharray: 5 5; fill-opacity: .02; }
      .zt { font-size: 12.5px; font-weight: 700; letter-spacing: .14em; fill: #94a3b8; }
      .carte { fill: url(#carte); stroke: #94a3b8; stroke-opacity: .25; }
      .accent { fill: none; stroke-width: 2; filter: url(#lueur); }
      .accent.vert { stroke: #34d399; }
      .accent.orange { stroke: #fb923c; stroke-opacity: .8; }
      .accent.bleu { stroke: #60a5fa; stroke-opacity: .7; }
      .n { font-size: 16px; font-weight: 700; fill: #f8fafc; }
      .s { font-size: 12.5px; fill: #94a3b8; }
      .port { font-family: Consolas, "Cascadia Mono", Menlo, monospace; font-size: 12.5px; fill: #7dd3fc; }
      .m { font-family: Consolas, "Cascadia Mono", Menlo, monospace; font-size: 12.5px; fill: #cbd5e1; }
      .et { font-size: 12.5px; font-weight: 700; paint-order: stroke; stroke: #0b1222; stroke-width: 6px; stroke-linejoin: round; }

      .rail { fill: none; stroke-width: 2.2; stroke-opacity: .28; }
      .flux { fill: none; stroke-width: 2.8; stroke-linecap: round; stroke-dasharray: 1 13; animation: avance 1.1s linear infinite; filter: url(#lueur); }
      .lent { animation-duration: 1.8s; }
      @keyframes avance { to { stroke-dashoffset: -28; } }
      @media (prefers-reduced-motion: reduce) { .flux { animation: none; } }

      .bleu { stroke: #60a5fa; } .vert { stroke: #34d399; } .orange { stroke: #fb923c; }
      .jaune { stroke: #facc15; } .violet { stroke: #c084fc; } .rouge { stroke: #f87171; } .gris { stroke: #94a3b8; }
      text.bleu, text.vert, text.orange, text.jaune, text.violet, text.rouge, text.gris { stroke: #0b1222; }
      text.bleu { fill: #93c5fd; } text.vert { fill: #6ee7b7; } text.orange { fill: #fdba74; }
      text.jaune { fill: #fde047; } text.violet { fill: #d8b4fe; } text.rouge { fill: #fca5a5; } text.gris { fill: #cbd5e1; }
    </style>
  </defs>

  <defs>
    <linearGradient id="p1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f472b6"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="p2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#c2410c"/></linearGradient>
    <linearGradient id="p3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient>
    <linearGradient id="p4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6ee7b7"/><stop offset="1" stop-color="#065f46"/></linearGradient>
    <linearGradient id="p5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fca5a5"/><stop offset="1" stop-color="#7f1d1d"/></linearGradient>
    <linearGradient id="p6" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a5b4fc"/><stop offset="1" stop-color="#312e81"/></linearGradient>
    <linearGradient id="p7" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#134e4a"/></linearGradient>
    <linearGradient id="p8" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdba74"/><stop offset="1" stop-color="#7c2d12"/></linearGradient>
    <linearGradient id="ecran" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#161c28"/><stop offset="1" stop-color="#0b0f16"/></linearGradient>
    <linearGradient id="voile" x1="0" y1="0" x2="0" y2="1"><stop offset=".45" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></linearGradient>
    <symbol id="affiche" viewBox="0 0 100 150" preserveAspectRatio="none">
      <circle cx="70" cy="44" r="17" fill="#fff" opacity=".4"/>
      <path d="M0 106 L27 78 L48 96 L72 68 L100 90 V150 H0z" fill="#000" opacity=".28"/>
      <path d="M0 124 L35 104 L62 118 L100 100 V150 H0z" fill="#000" opacity=".2"/>
    </symbol>
    <symbol id="vignette" viewBox="0 0 196 110" preserveAspectRatio="none">
      <circle cx="150" cy="34" r="15" fill="#fff" opacity=".35"/>
      <path d="M0 80 Q40 60 80 76 T160 70 T196 74 V110 H0z" fill="#000" opacity=".3"/>
      <rect width="196" height="110" fill="url(#voile)"/>
    </symbol>
    <symbol id="livre" viewBox="0 0 110 110" preserveAspectRatio="none">
      <rect x="0" y="0" width="8" height="110" fill="#000" opacity=".22"/>
      <path d="M18 82 H94" stroke="#fff" stroke-opacity=".45" stroke-width="1.5"/>
    </symbol>
  </defs>
  <style>
    .plex { fill: #e5a00d; }
    .onglet { font-size: 14px; fill: #94a3b8; }
    .onglet.actif { fill: #ffffff; font-weight: 700; }
    .rang { font-size: 17px; font-weight: 700; fill: #f8fafc; }
    .tt { font-size: 12.5px; font-weight: 700; fill: #e2e8f0; }
    .an { font-size: 11.5px; fill: #8b97ab; }
    .lt { font-size: 11.5px; font-weight: 700; fill: #ffffff; }
    .la { font-size: 10.5px; fill: #ffffff; opacity: .8; }
    .badge { font-size: 9px; font-weight: 800; fill: #0b1222; letter-spacing: .04em; }
    .leg { font-size: 12.5px; fill: #94a3b8; }
  </style>

  <rect width="1200" height="680" fill="url(#fond)"/>
  <rect width="1200" height="680" fill="url(#points)"/>

  <text x="40" y="56" class="titre">Le soir, j'ouvre Plex : tout est déjà là</text>
  <text x="40" y="84" class="soustitre">Illustration avec des films libres du Blender Institute. Les séries sont imaginaires.</text>

  <g filter="url(#ombre)"><rect x="40" y="104" width="1120" height="552" rx="16" fill="#0b1222" stroke="#94a3b8" stroke-opacity=".45" stroke-width="2"/></g>
  <rect x="56" y="120" width="1088" height="520" rx="8" fill="url(#ecran)"/>

  <!-- Barre du haut -->
  <rect x="76" y="136" width="32" height="32" rx="8" fill="#f8fafc"/><image href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1MTIgNTEyIj48cmVjdCB3aWR0aD0iNTEyIiBoZWlnaHQ9IjUxMiIgZmlsbD0iIzI4MmEyZCIgcng9IjE1JSIvPjxwYXRoIGZpbGw9IiNlNWEwMGQiIGQ9Ik0yNTYgNzBIMTQ4bDEwOCAxODYtMTA4IDE4NmgxMDhsMTA4LTE4NnoiLz48L3N2Zz4=" x="80" y="140" width="24" height="24" preserveAspectRatio="xMidYMid meet"/>
  <text x="124" y="157" class="onglet actif">Accueil</text>
  <rect x="124" y="165" width="52" height="3" rx="1.5" class="plex"/>
  <text x="200" y="157" class="onglet">Films</text>
  <text x="258" y="157" class="onglet">Séries</text>
  <path d="M872,145 h16 v16z" class="plex"/>
  <text x="896" y="158" class="leg">pas encore vu</text>
  <rect x="1006" y="150" width="34" height="5" rx="2.5" fill="#334155"/><rect x="1006" y="150" width="20" height="5" rx="2.5" class="plex"/>
  <text x="1048" y="158" class="leg">en cours</text>

  <!-- Films -->
  <text x="76" y="212" class="rang">Films ajoutés récemment</text>
  <g>
    <rect x="76" y="226" width="100" height="150" rx="6" fill="url(#p1)"/><use href="#affiche" x="76" y="226" width="100" height="150"/>
    <path d="M154,226 h16 a6 6 0 0 1 6 6 v16z" class="plex"/>
    <text x="76" y="396" class="tt">Sintel</text><text x="76" y="412" class="an">2010</text>

    <rect x="192" y="226" width="100" height="150" rx="6" fill="url(#p4)"/><use href="#affiche" x="192" y="226" width="100" height="150"/>
    <path d="M270,226 h16 a6 6 0 0 1 6 6 v16z" class="plex"/>
    <text x="192" y="396" class="tt">Sprite Fright</text><text x="192" y="412" class="an">2021</text>

    <rect x="308" y="226" width="100" height="150" rx="6" fill="url(#p2)"/><use href="#affiche" x="308" y="226" width="100" height="150"/>
    <path d="M386,226 h16 a6 6 0 0 1 6 6 v16z" class="plex"/>
    <text x="308" y="396" class="tt">Spring</text><text x="308" y="412" class="an">2019</text>

    <rect x="424" y="226" width="100" height="150" rx="6" fill="url(#p3)"/><use href="#affiche" x="424" y="226" width="100" height="150"/>
    <path d="M502,226 h16 a6 6 0 0 1 6 6 v16z" class="plex"/>
    <text x="424" y="396" class="tt">Tears of Steel</text><text x="424" y="412" class="an">2012</text>

    <rect x="540" y="226" width="100" height="150" rx="6" fill="url(#p5)"/><use href="#affiche" x="540" y="226" width="100" height="150"/>
    <rect x="546" y="364" width="88" height="5" rx="2.5" fill="#000" fill-opacity=".5"/><rect x="546" y="364" width="53" height="5" rx="2.5" class="plex"/>
    <text x="540" y="396" class="tt">Agent 327</text><text x="540" y="412" class="an">2017</text>

    <rect x="656" y="226" width="100" height="150" rx="6" fill="url(#p6)"/><use href="#affiche" x="656" y="226" width="100" height="150"/>
    <text x="656" y="396" class="tt">Big Buck Bunny</text><text x="656" y="412" class="an">2008</text>

    <rect x="772" y="226" width="100" height="150" rx="6" fill="url(#p8)"/><use href="#affiche" x="772" y="226" width="100" height="150"/>
    <text x="772" y="396" class="tt">Charge</text><text x="772" y="412" class="an">2022</text>

    <rect x="888" y="226" width="100" height="150" rx="6" fill="url(#p7)"/><use href="#affiche" x="888" y="226" width="100" height="150"/>
    <text x="888" y="396" class="tt">Coffee Run</text><text x="888" y="412" class="an">2020</text>

    <rect x="1004" y="226" width="100" height="150" rx="6" fill="url(#p1)"/><use href="#affiche" x="1004" y="226" width="100" height="150"/>
    <text x="1004" y="396" class="tt">Cosmos Laundr…</text><text x="1004" y="412" class="an">2015</text>
  </g>

  <!-- Séries -->
  <text x="76" y="452" class="rang">Nouveaux épisodes</text>
  <g>
    <rect x="76" y="466" width="196" height="110" rx="6" fill="url(#p3)"/><use href="#vignette" x="76" y="466" width="196" height="110"/>
    <rect x="84" y="474" width="58" height="16" rx="4" class="plex"/><text x="113" y="485.5" class="badge" text-anchor="middle">NOUVEAU</text>
    <text x="76" y="596" class="tt">Orbite Basse</text><text x="76" y="612" class="an">Saison 2 · Épisode 6</text>

    <rect x="288" y="466" width="196" height="110" rx="6" fill="url(#p8)"/><use href="#vignette" x="288" y="466" width="196" height="110"/>
    <rect x="296" y="474" width="58" height="16" rx="4" class="plex"/><text x="325" y="485.5" class="badge" text-anchor="middle">NOUVEAU</text>
    <text x="288" y="596" class="tt">Café Minuit</text><text x="288" y="612" class="an">Saison 1 · Épisode 9</text>

    <rect x="500" y="466" width="196" height="110" rx="6" fill="url(#p6)"/><use href="#vignette" x="500" y="466" width="196" height="110"/>
    <rect x="508" y="474" width="58" height="16" rx="4" class="plex"/><text x="537" y="485.5" class="badge" text-anchor="middle">NOUVEAU</text>
    <text x="500" y="596" class="tt">Le Phare</text><text x="500" y="612" class="an">Saison 3 · Épisode 3</text>

    <rect x="712" y="466" width="196" height="110" rx="6" fill="url(#p7)"/><use href="#vignette" x="712" y="466" width="196" height="110"/>
    <rect x="720" y="474" width="98" height="16" rx="4" class="plex"/><text x="769" y="485.5" class="badge" text-anchor="middle">NOUVELLE SÉRIE</text>
    <text x="712" y="596" class="tt">Nuit Polaire</text><text x="712" y="612" class="an">Saison 1 · Épisode 1</text>

    <rect x="924" y="466" width="196" height="110" rx="6" fill="url(#p3)"/><use href="#vignette" x="924" y="466" width="196" height="110"/>
    <rect x="932" y="564" width="180" height="5" rx="2.5" fill="#000" fill-opacity=".5"/><rect x="932" y="564" width="66" height="5" rx="2.5" class="plex"/>
    <text x="924" y="596" class="tt">Orbite Basse</text><text x="924" y="612" class="an">Reprendre · Saison 2 · Épisode 5</text>
  </g>

</svg>
